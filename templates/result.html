{% extends "base.html" %}

{% block title %}
AstrophotoWebStack
{% endblock title %}

{% block content %}

<div class="pane-container">
	<div class="left-pane">
		<h2>Stacking log:</h2>
		<div id="logContent" class="log-box">
			<pre id="logText" style="margin: 0; white-space: pre-wrap;"></pre>
		</div>
	</div>
	<div class="right-pane">
		<h2 class="preview-pane-text">Result preview (stretched):</h2>
		<a href="/preview/{{ stack_id }}" target="_blank">
			<img src="/thumbnail/{{ stack_id }}" alt="Result thumbnail" class="result-image">
		</a>
		<br>
		<a href="/download/{{ stack_id }}" class="download-button">Download result.fit</a>
	</div>
</div>

<script>
	function fetchLogContent() {
		fetch('/log/{{ stack_id }}')
			.then(response => response.json())
			.then(data => {
				const logText = document.getElementById('logText');
				logText.innerText = data.log_content;
				if (data.log_content.includes('Trace is stopped')) {
					if (data.log_content.includes('[status: success]')) {
						document.getElementById('logContent').style.color = '#d4edda';
					}  

					if (data.log_content.includes('[status: error]')) {
						document.getElementById('logContent').style.color = '#f8d7da';
						//load oops.gif from static/img/oops.gif instead of the result preview image
						const resultImage = document.querySelector('.result-image');
						resultImage.src = "{{ url_for('static', filename='img/err/oops' + log_check + '.jpg') }}"
						resultImage.alt = "Error occurred during stacking";

						//delete the download button
						const downloadButton = document.querySelector('.download-button');
						if (downloadButton) {
							downloadButton.remove();
						}

						//delete the Result preview text
						const resultPreviewText = document.querySelector('.preview-pane-text');
						if (resultPreviewText) {
							resultPreviewText.remove();
						}
					}
				}
				logText.parentElement.scrollTop = logText.scrollHeight; // Autoscroll to the bottom
			})
			.catch(error => console.error('Error fetching log content:', error));
	}

	fetchLogContent();
</script>

{% endblock content %}
