services:
  web:
    image: ghcr.io/kubakubakuba/astrophotowebstack-web:latest
    ports:
      - "${SERVER_PORT}:80"
    volumes:
      - ${HOST_DATA_PATH}:/data:rw
      - ${HOST_LOG_PATH}:/logs:rw
      - ${STACKING_DIRECTORY}:/stack:rw
    environment:
      - HOME_DIR=/data
      - LOG_DIR=/logs
      - SECRET_KEY=${SECRET_KEY}
      - STACKING_DIRECTORY=/stack
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./.env

  stacker:
    image: ghcr.io/kubakubakuba/astrophotowebstack-stacker:latest
    volumes:
      - ${HOST_DATA_PATH}:/data:rw
      - ${HOST_LOG_PATH}:/logs:rw
      - ${STACKING_DIRECTORY}:/stack:rw
    environment:
      - HOME_DIR=/data
      - LOG_DIR=/logs
      - SIRIL_CLI=/usr/sbin/siril-cli
      - STACKING_DIRECTORY=/stack
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      sh -c "while true; do
        echo 'Running stacker script...';
        python stacker.py;
        echo 'Stacker run complete. Sleeping for ${STACKER_INTERVAL_S} seconds...';
        sleep ${STACKER_INTERVAL_S};
      done"
    env_file:
      - ./.env
